[phases.setup]
aptPkgs = [
  "ca-certificates",
  "ffmpeg",
  "python3",
  "python3-venv",
  "fonts-liberation",
  "libasound2",
  "libatk-bridge2.0-0",
  "libatk1.0-0",
  "libatspi2.0-0",
  "libcairo2",
  "libcups2",
  "libdbus-1-3",
  "libdrm2",
  "libgbm1",
  "libglib2.0-0",
  "libgtk-3-0",
  "libnspr4",
  "libnss3",
  "libpango-1.0-0",
  "libx11-6",
  "libxcb1",
  "libxcomposite1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxkbcommon0",
  "libxrandr2",
  "libxshmfence1",
  "wget"
]

[phases.music]
dependsOn = ["install"]
cmds = ["python3 -m venv /opt/music", "/opt/music/bin/pip install --no-cache-dir 'yt-dlp[default]'"]

[variables]
YTDLP_PATH = "/opt/music/bin/yt-dlp"

[phases.build]
dependsOn = ["music"]
cmds = ["npm run build:ts"]
